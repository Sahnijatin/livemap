name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Typecheck and unit tests on every OS and Node version: the path, symlink and watcher code has platform branches.
  unit:
    name: Unit (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # Hosted runners are slower than a developer machine (Ubuntu about 2x, macOS and Windows more): timed tests scale their budgets.
      LIVEMAP_TIME_SCALE: ${{ matrix.os == 'ubuntu-latest' && '2' || '3' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
        include:
          # LiveMap's ServiceNow users run it on Windows; one Node version covers the platform branches.
          - os: windows-latest
            node: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json
      - run: npm ci
      - run: npm --prefix ui ci
      # npm test reuses this build (LIVEMAP_TEST_PREBUILT below), so no test worker rebuilds while others run timed tests.
      - run: npm run build
      - run: npm run typecheck
      - run: npm --prefix ui run typecheck
      - run: npm test
        env:
          LIVEMAP_TEST_PREBUILT: '1'
      - run: npm --prefix ui test
        env:
          # UI code runs in the browser, so its timed budgets are meant for a current engine. Node 20's V8 builds the palette index about 3x slower than Node 22 on the same runner.
          LIVEMAP_TIME_SCALE: ${{ (matrix.os != 'ubuntu-latest' || matrix.node == 20) && '3' || '1' }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: unit-results-${{ matrix.os }}-node${{ matrix.node }}
          path: test-results/
          if-no-files-found: ignore

  # Docs, licenses, size budget, browser e2e and the packed-tarball smoke test once, on Ubuntu with Node 22.
  e2e:
    name: E2E, docs, budget and smoke (ubuntu, Node 22)
    # Pinned: Playwright 1.56 has no browser build for Ubuntu 26.04, which ubuntu-latest now is. Move on when Playwright is upgraded.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json
      - run: npm ci
      - run: npm --prefix ui ci
      - run: npm run build
      - run: npm run docs:check
      # Every shipped package's license is on the allowlist in scripts/notices.mjs.
      - run: npm run licenses:check
      - run: npm run budget
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run smoke
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results
          path: test-results/
          if-no-files-found: ignore
