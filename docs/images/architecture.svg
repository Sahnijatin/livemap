<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="LiveMap architecture: project files, agent hooks and git feed the watcher, parsers, project model and agent hub; the server runs the domain analyzers over the project model and sends their index on; the server records to the history store, asks the summarizer and streams to the browser UI">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#808890"/>
    </marker>
  </defs>
  <style>
    rect { fill: none; stroke: #808890; stroke-width: 1.5; }
    rect.src { stroke-dasharray: 5 4; }
    text { fill: #808890; font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; text-anchor: middle; dominant-baseline: middle; }
    text.s { font-size: 11.5px; fill: #6e7781; }
    line, path { stroke: #808890; stroke-width: 1.5; fill: none; }
  </style>

  <!-- Inputs -->
  <rect class="src" x="20" y="20" width="200" height="44" rx="8"/><text x="120" y="42">Project files</text>
  <rect class="src" x="460" y="20" width="200" height="44" rx="8"/><text x="560" y="35">Agent hooks</text><text class="s" x="560" y="52">Claude Code, Codex, Cursor</text>
  <rect class="src" x="680" y="20" width="200" height="44" rx="8"/><text x="780" y="35">Git</text><text class="s" x="780" y="52">HEAD poll, --pull</text>

  <!-- Engine -->
  <rect x="20" y="100" width="200" height="44" rx="8"/><text x="120" y="122">Watcher</text>
  <rect x="240" y="100" width="200" height="44" rx="8"/><text x="340" y="122">Parsers (tree-sitter)</text>
  <rect x="460" y="100" width="420" height="44" rx="8"/><text x="670" y="122">Agent hub and attribution</text>
  <rect x="20" y="180" width="200" height="44" rx="8"/><text x="120" y="202">Domain analyzers</text>
  <rect x="240" y="180" width="200" height="44" rx="8"/><text x="340" y="202">Project model</text>

  <!-- Server side -->
  <rect x="20" y="260" width="200" height="44" rx="8"/><text x="120" y="282">History store</text>
  <rect x="240" y="260" width="400" height="44" rx="8"/><text x="440" y="282">Server: REST and WebSocket (127.0.0.1)</text>
  <rect x="680" y="260" width="200" height="44" rx="8"/><text x="780" y="275">Summarizer</text><text class="s" x="780" y="292">opt-in, your provider</text>

  <!-- Browser -->
  <rect x="20" y="340" width="860" height="44" rx="8"/><text x="450" y="362">Browser UI: live, rewind and exported replay</text>

  <!-- Arrows -->
  <line x1="120" y1="64" x2="120" y2="98" marker-end="url(#a)"/>
  <line x1="220" y1="122" x2="238" y2="122" marker-end="url(#a)"/>
  <line x1="340" y1="144" x2="340" y2="178" marker-end="url(#a)"/>
  <line x1="240" y1="202" x2="222" y2="202" marker-end="url(#a)"/>
  <line x1="560" y1="64" x2="560" y2="98" marker-end="url(#a)"/>
  <line x1="780" y1="64" x2="780" y2="98" marker-end="url(#a)"/>
  <line x1="560" y1="144" x2="560" y2="258" marker-end="url(#a)"/>
  <line x1="340" y1="224" x2="340" y2="258" marker-end="url(#a)"/>
  <path d="M200 224V242H290V258" marker-end="url(#a)"/>
  <line x1="240" y1="282" x2="222" y2="282" marker-end="url(#a)"/>
  <line x1="642" y1="282" x2="678" y2="282" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="440" y1="304" x2="440" y2="338" marker-end="url(#a)"/>
</svg>
